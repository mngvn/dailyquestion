<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Daily Mini — a crossword a day</title>
  <meta name="description" content="A five-by-five crossword, new every day. Fill the windows in, keep the streak lit." />
  <meta name="theme-color" content="#03051a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#243267" media="(prefers-color-scheme: light)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Tilt+Neon&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="crossword.css" />
</head>
<body class="cross">
  <!-- the skyline along the bottom of the page: crossword.js draws it -->
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <header class="top">
    <a class="back" href="index.html" aria-label="Back to Daily">← Back</a>
    <div class="title">
      <h1>The Daily Mini</h1>
      <p class="when" id="when"></p>
    </div>
    <div class="meters">
      <button class="meter meter-streak" id="streakBtn" type="button" aria-haspopup="dialog" title="Your streak and record">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" /></svg>
        <b id="streakNum">0</b><span class="sr-only" id="streakSay">day streak. Open your record.</span>
      </button>
      <p class="meter meter-time" id="time" role="timer" aria-label="Time taken">0:00</p>
    </div>
  </header>

  <!-- the last seven days: today's, and the six before it to catch up on -->
  <nav class="week" id="week" aria-label="This week's puzzles"></nav>

  <main class="play">
    <section class="board-col">
      <div class="cluebar" id="cluebar">
        <button class="step" id="prevClue" type="button" aria-label="Previous clue">‹</button>
        <p class="cluebar-text" id="clueNow" aria-live="polite"></p>
        <button class="step" id="nextClue" type="button" aria-label="Next clue">›</button>
      </div>

      <!-- the puzzle: a block of flats, five windows by five. A light goes on
           in each as it is filled in. -->
      <div class="tower">
        <div class="grid" id="grid" role="grid" tabindex="0" aria-label="Crossword grid. Type to fill it in; arrow keys move, Space turns the corner."></div>
      </div>

      <div class="tools">
        <details class="menu" id="checkMenu">
          <summary>Check</summary>
          <div class="menu-list">
            <button type="button" data-do="check-cell">This square</button>
            <button type="button" data-do="check-word">This word</button>
            <button type="button" data-do="check-all">The whole puzzle</button>
            <p>Checking is free.</p>
          </div>
        </details>
        <details class="menu" id="revealMenu">
          <summary>Reveal</summary>
          <div class="menu-list">
            <button type="button" data-do="reveal-cell">This square</button>
            <button type="button" data-do="reveal-word">This word</button>
            <button type="button" data-do="reveal-all">The whole puzzle</button>
            <p>A reveal means today doesn't count toward your streak.</p>
          </div>
        </details>
        <button class="tool" id="clearBtn" type="button">Clear</button>
      </div>
      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </section>

    <section class="clues" aria-label="Clues">
      <div class="clue-col">
        <h2>Across</h2>
        <ol id="across"></ol>
      </div>
      <div class="clue-col">
        <h2>Down</h2>
        <ol id="down"></ol>
      </div>
    </section>
  </main>

  <!-- for fingers: phones don't put a keyboard up for a grid -->
  <div class="keys" id="keys" aria-label="Keyboard"></div>

  <!-- solved, or the record looked at from the flame in the corner -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-veil" id="sheetVeil"></div>
    <div class="sheet-card">
      <p class="sheet-kicker" id="sheetKicker"></p>
      <h2 class="sheet-title" id="sheetTitle"></h2>
      <p class="sheet-line" id="sheetLine"></p>
      <dl class="stats" id="stats"></dl>
      <p class="sheet-past" id="sheetPast"></p>
      <div class="sheet-row">
        <button class="pill" id="shareBtn" type="button">Copy result</button>
        <a class="pill pill-quiet" href="index.html">Back to the city</a>
        <button class="pill pill-quiet" id="sheetClose" type="button">Close</button>
      </div>
    </div>
  </div>

  <noscript><p class="no-script">The crossword needs JavaScript. <a href="index.html">Back to Daily</a></p></noscript>

  <script src="theme.js"></script>
  <script src="deck.js"></script>
  <script src="crossword-data.js"></script>
  <script src="crossword.js"></script>
</body>
</html>
