<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily — five crumpled notes on a candlelit desk</title>
  <meta name="description" content="Four fun facts and today in history, written on crumpled notes on a candlelit chart desk. Pick one up and hold on to unfold it." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="home.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" crossorigin />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/environments/RoomEnvironment.js" crossorigin />
  <link rel="modulepreload" href="stage.js" />
  <link rel="modulepreload" href="room-props.js" />
  <link rel="modulepreload" href="flame.js" />
  <link rel="modulepreload" href="paper.js" />
  <link rel="modulepreload" href="paper-solver.js" />
  <link rel="modulepreload" href="world.js" />
  <link rel="modulepreload" href="shredder.js" />
  <noscript><style>.bleed { display: none; }</style></noscript>
</head>
<body class="home">
  <!-- The page arrives through this: it opens round the candle and bleeds
       outward while the desk is made ready behind it (bleed.js). -->
  <canvas class="bleed" id="bleed" aria-hidden="true"></canvas>
  <main>
    <!-- The chart room: a cartographer's desk lit by one candle, with today's
         five notes crumpled on it. stage.js builds it in 3D; if it can't, the
         notes are laid out flat in .flat-desk instead. -->
    <section class="room" id="room" data-mode="loading" aria-labelledby="date">
      <h1 class="room-date" id="date">Today</h1>
      <div class="room-loading" aria-hidden="true"><span class="room-loading-flame"></span></div>
      <div class="flat-desk" id="flatDesk"></div>
      <nav class="eggs" aria-label="Strange little detours">
        <a class="egg-link" href="sun.html" title="…do not hold the star" aria-label="A strange little detour: Sunball">☀️</a>
        <a class="egg-link" href="orbit.html" title="…can you make it all the way around?" aria-label="Another strange little detour: Orbit surfer">🛰️</a>
        <a class="egg-link" href="park.html" title="…slide it into the spot" aria-label="A third strange little detour: Drift Park">🅿️</a>
        <a class="egg-link" href="cave.html" title="…how deep can you go?" aria-label="A fourth strange little detour: Rare Air">🔦</a>
      </nav>
    </section>
  </main>

  <script src="theme.js"></script>
  <script src="bleed.js"></script>
  <script src="deck.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="wisps.js"></script>
  <script type="module" src="desk.js"></script>
</body>
</html>
