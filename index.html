<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily — Two crumpled notes, a puzzle, trivia and more, every day</title>
  <meta name="description" content="Unfold today's fun fact and today in history, then try the daily puzzle, a trivia run, the artwork of the day and a guess-the-city game. Build your streak!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="desk.css" />
  <link rel="stylesheet" href="room.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" crossorigin />
</head>
<body class="home">
  <div class="backdrop" aria-hidden="true">
    <div class="aurora"></div>
    <div class="dots"></div>
  </div>
  <div id="confetti" class="confetti-layer" aria-hidden="true"></div>

  <header class="nav">
    <a class="brand" href="./" aria-label="Daily, home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Daily</span>
    </a>
    <div class="nav-day" id="navDay"></div>
    <div class="nav-actions">
      <div class="streak" id="streakPill" title="Your current streak">
        <svg class="streak-icon" id="flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 3.5 5 5.8 5 11a5 5 0 0 1-10 0c0-2.4 1.1-3.9 2.3-5.1.3 1.6 1 2.6 2.1 3.1C11 8.6 11.3 5 12 2Z"/></svg>
        <span class="streak-num" id="streakNum">0</span>
        <span class="streak-label">day streak</span>
      </div>
      <button class="icon-btn" id="moviesBtn" type="button" aria-haspopup="dialog" title="Movies to watch" aria-label="Movies to watch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4l2 5M14 4l2 5"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-pressed="false" title="Toggle light / dark mode" aria-label="Toggle light or dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
  <!-- The chart room: a cartographer's desk lit by one candle. stage.js builds
       it in 3D; the flat desk below is what shows if it can't. -->
  <section class="room" id="room" data-mode="loading" aria-label="The chart room">
    <div class="hero">
      <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span><span id="weekday">Today</span></p>
      <h1 class="hero-title" data-blur-text>Today came in two crumpled notes.</h1>
      <p class="hero-date" id="dateMain"></p>
      <p class="hero-sub"><span class="shiny-text">Pick one up off the desk and hold on. It opens in your hand.</span></p>
    </div>
    <div class="room-loading" aria-hidden="true"><span class="room-loading-flame"></span></div>
    <div class="desk" id="desk" data-lit="true">
      <div class="desk-grid">
        <div class="chart" id="chart" aria-hidden="true"></div>
        <div class="desk-side desk-left" id="deskLeft"></div>

        <div class="desk-candle">
          <button class="candle" id="candle" type="button" aria-pressed="false" aria-label="A candle. Click to blow it out.">
            <span class="candle-dish"></span>
            <span class="candle-wax"></span>
            <span class="candle-wick"></span>
            <span class="flame" aria-hidden="true">
              <span class="flame-halo"></span>
              <svg class="flame-svg" viewBox="0 0 40 90">
                <defs>
                  <radialGradient id="flameOuter" cx="50%" cy="80%" r="70%">
                    <stop class="fo2" offset="0"/><stop class="fo3" offset="0.55"/><stop class="fo4" offset="1"/>
                  </radialGradient>
                  <radialGradient id="flameInner" cx="50%" cy="78%" r="60%">
                    <stop class="fo1" offset="0"/><stop class="fo2" offset="0.6"/><stop class="fo4" offset="1"/>
                  </radialGradient>
                </defs>
                <path class="flame-outer" fill="url(#flameOuter)" d="M20 2 C25 22 38 40 38 62 C38 78 30 88 20 88 C10 88 2 78 2 62 C2 40 15 22 20 2 Z"/>
                <path class="flame-inner" fill="url(#flameInner)" d="M20 28 C24 44 31 54 31 66 C31 77 26 85 20 85 C14 85 9 77 9 66 C9 54 16 44 20 28 Z"/>
                <ellipse class="flame-core" cx="20" cy="80" rx="5" ry="8"/>
              </svg>
            </span>
          </button>
        </div>

        <article class="note note-fact" id="factNote" data-state="loading">
          <header class="note-head">
            <span class="note-kicker">Fun fact</span>
            <span class="note-count"></span>
          </header>
          <div class="paper-stage">
            <div class="paper-skeleton" aria-hidden="true"></div>
          </div>
          <div class="note-foot">
            <div class="note-hint" aria-hidden="true">
              <span class="note-hint-text shiny-text">Press and hold to unfold</span>
              <span class="note-meter"><span></span></span>
            </div>
            <div class="note-actions">
              <button class="btn btn-ghost" type="button" data-action="copy">Copy</button>
              <button class="btn btn-ghost btn-down" type="button" data-action="down">Put it down</button>
              <button class="btn btn-solid" type="button" data-action="next">Next fact</button>
            </div>
          </div>
          <p class="sr-only note-live" aria-live="polite"></p>
        </article>

        <article class="note note-history" id="historyNote" data-state="loading">
          <header class="note-head">
            <span class="note-kicker">On this day</span>
            <span class="note-count"></span>
          </header>
          <div class="paper-stage">
            <div class="paper-skeleton" aria-hidden="true"></div>
          </div>
          <div class="note-foot">
            <div class="note-hint" aria-hidden="true">
              <span class="note-hint-text shiny-text">Press and hold to unfold</span>
              <span class="note-meter"><span></span></span>
            </div>
            <div class="note-actions">
              <button class="btn btn-ghost" type="button" data-action="copy">Copy</button>
              <button class="btn btn-ghost btn-down" type="button" data-action="down">Put it down</button>
              <button class="btn btn-solid" type="button" data-action="refold">Crumple it up</button>
            </div>
          </div>
          <p class="sr-only note-live" aria-live="polite"></p>
        </article>

        <div class="desk-bottom" id="deskBottom">
          <section class="plaque" aria-label="Your stats">
            <div class="stat"><span class="stat-num" id="statPlayed">0</span><span class="stat-label">Days at sea</span></div>
            <div class="stat"><span class="stat-num" id="statBest">0</span><span class="stat-label">Best streak</span></div>
            <div class="stat"><span class="stat-num" id="statCorrect">0</span><span class="stat-label">Trivia correct</span></div>
            <div class="stat"><span class="stat-num" id="statAccuracy">—</span><span class="stat-label">Accuracy</span></div>
          </section>
        </div>
        <div class="desk-side desk-right" id="deskRight"></div>
      </div>
      <div class="desk-dark" aria-hidden="true"></div>
      <div class="desk-glow" aria-hidden="true"></div>
    </div>
  </section>
  </main>

  <footer class="footer">
    <p>Daily · a fresh set every midnight</p>
    <nav class="eggs" aria-label="Strange little detours">
      <a class="egg-link" href="sun.html" title="…do not hold the star" aria-label="A strange little detour: Sunball">☀️</a>
      <a class="egg-link" href="orbit.html" title="…can you make it all the way around?" aria-label="Another strange little detour: Orbit surfer">🛰️</a>
      <a class="egg-link" href="park.html" title="…slide it into the spot" aria-label="A third strange little detour: Drift Park">🅿️</a>
      <a class="egg-link" href="cave.html" title="…how deep can you go?" aria-label="A fourth strange little detour: Rare Air">🔦</a>
    </nav>
  </footer>

  <!-- Section modal: stays layered over the page so it feels like the same
       screen. The frame around it is dressed for whatever it opened out of. -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal-frame" id="modalFrame">
      <span class="modal-deco modal-deco-top" aria-hidden="true"></span>
      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
        <div class="modal-head">
          <span class="modal-icon" id="modalIcon"></span>
          <h2 class="modal-title" id="modalTitle"></h2>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
      <span class="modal-deco modal-deco-bottom" aria-hidden="true"></span>
    </div>
  </div>

  <script src="deck.js"></script>
  <script src="data.js"></script>
  <script src="artwork.js"></script>
  <script src="puzzles.js"></script>
  <script src="places.js"></script>
  <script src="photos.js"></script>
  <script src="locate.js"></script>
  <script src="trivia.js"></script>
  <script src="movies.js"></script>
  <script src="props.js"></script>
  <script src="bits.js"></script>
  <script src="app.js"></script>
  <script src="theme.js"></script>
  <script src="wisps.js"></script>
  <script src="candle.js"></script>
  <script type="module" src="desk.js"></script>
</body>
</html>
